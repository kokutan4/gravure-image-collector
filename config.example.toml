# コピーして config.toml として使ってください: cp config.example.toml config.toml

# 画像の保存先(アカウントごとにサブフォルダが作られます)
output_dir = "images"

# 取得済みの投稿・画像を記録するデータベース
db_path = "collector.sqlite3"

# 1アカウントあたり1回の実行で見る投稿数の上限(API の読み取り量=料金に直結します)
max_posts_per_account = 100

# リポスト・リプライを除外するか
exclude_retweets = true
exclude_replies = true

# 動画・GIF も保存するか(false なら写真のみ)
include_videos = false

# API リクエスト間の最小間隔(秒)。レート制限に当たらないよう余裕を持たせています
min_request_interval = 1.5

# 画像ダウンロード間の最小間隔(秒)
min_download_interval = 0.5

# 収集するアカウント(@ は不要)
accounts = [
  "example_account",
]
